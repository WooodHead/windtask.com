<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">pull_request versus pull_request_target trust split</title>
  <desc id="desc">pull_request runs the merge-commit workflow with a read-only token and no secrets. pull_request_target runs the default-branch workflow with the base repository token and secrets. Risk appears when that privileged job checks out and executes fork code.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .ink { fill: #0f172a; }
    .muted { fill: #475569; }
    .card { fill: #ffffff; stroke: #94a3b8; }
    .safe { fill: #ecfdf5; stroke: #34d399; }
    .priv { fill: #fff7ed; stroke: #fb923c; }
    .risk { fill: #fef2f2; stroke: #f87171; }
    .safeInk { fill: #065f46; }
    .privInk { fill: #9a3412; }
    .riskInk { fill: #991b1b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .card { fill: #1e293b; stroke: #64748b; }
      .safe { fill: #064e3b; stroke: #34d399; }
      .priv { fill: #431407; stroke: #fb923c; }
      .risk { fill: #450a0a; stroke: #f87171; }
      .safeInk { fill: #a7f3d0; }
      .privInk { fill: #fed7aa; }
      .riskInk { fill: #fecaca; }
    }
  </style>
  <rect class="bg" width="980" height="420"/>
  <text class="ink" x="28" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Which workflow file runs, and what trust it receives</text>
  <text class="muted" x="28" y="54" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Fork pull request. Default checkout behavior. The danger is mixing the right columns trust with the left columns code.</text>

  <rect class="safe" x="28" y="78" width="440" height="250" rx="10"/>
  <text class="safeInk" x="48" y="108" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">pull_request</text>
  <text class="ink" x="48" y="136" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Workflow file: PR merge commit (fork-controlled)</text>
  <text class="ink" x="48" y="160" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Default checkout: that same merge commit</text>
  <text class="ink" x="48" y="184" font-family="system-ui,Segoe UI,sans-serif" font-size="13">GITHUB_TOKEN: read-only on forks</text>
  <text class="ink" x="48" y="208" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Repository / org secrets: withheld</text>
  <text class="ink" x="48" y="232" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Fork approval can gate first-time compute</text>
  <text class="safeInk" x="48" y="292" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Use this when CI does not need secrets.</text>

  <rect class="priv" x="512" y="78" width="440" height="250" rx="10"/>
  <text class="privInk" x="532" y="108" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">pull_request_target</text>
  <text class="ink" x="532" y="136" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Workflow file: base default branch (trusted)</text>
  <text class="ink" x="532" y="160" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Default checkout: base ref, not the fork</text>
  <text class="ink" x="532" y="184" font-family="system-ui,Segoe UI,sans-serif" font-size="13">GITHUB_TOKEN: base repo, often write</text>
  <text class="ink" x="532" y="208" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Secrets: available, same class as push</text>
  <text class="ink" x="532" y="232" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Cache on default branch: read-only by default</text>
  <text class="privInk" x="532" y="292" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Safe only if fork code is never executed.</text>

  <rect class="risk" x="28" y="344" width="924" height="56" rx="8"/>
  <text class="riskInk" x="48" y="378" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Break: checkout head.sha / merge ref / fork repo, then build, test, install, or run a script from that tree.</text>
</svg>
