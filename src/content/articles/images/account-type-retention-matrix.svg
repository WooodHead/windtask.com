<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc">
  <title id="title">Account type × self-assessment × retention matrix</title>
  <desc id="desc">Matrix comparing consumer, Teams/Enterprise UI, commercial API with ZDR, and Cyber Verification for whether self-assessment runs and how long flagged data may be kept</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="980" height="480" fill="#f8fafc"/>

  <text x="40" y="36" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Account type × self-assessment × retention (decision view)</text>
  <text x="40" y="56" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Summarized from Anthropic safeguards + Privacy Center + API retention docs (Nov 2026). Confirm your contract.</text>

  <!-- Header row -->
  <rect x="40" y="78" width="200" height="52" rx="8" fill="#0f172a"/>
  <text x="140" y="110" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Account / path</text>

  <rect x="250" y="78" width="160" height="52" rx="8" fill="#0f172a"/>
  <text x="330" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Self-assessment</text>
  <text x="330" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">runs today?</text>

  <rect x="420" y="78" width="220" height="52" rx="8" fill="#0f172a"/>
  <text x="530" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Typical retention</text>
  <text x="530" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">unflagged chats</text>

  <rect x="650" y="78" width="290" height="52" rx="8" fill="#0f172a"/>
  <text x="795" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">If trust &amp; safety flags</text>
  <text x="795" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">inputs/outputs · scores</text>

  <!-- Row 1: Consumer -->
  <rect x="40" y="140" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="140" y="168" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Consumer</text>
  <text x="140" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">Free / Pro / Max / Ultra</text>
  <text x="140" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">+ Claude Code on those</text>

  <rect x="250" y="140" width="160" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="330" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e40af">Yes</text>
  <text x="330" y="192" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1e40af">on eligible retained</text>
  <text x="330" y="206" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1e40af">traffic (Fable 5+)</text>

  <rect x="420" y="140" width="220" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="530" y="168" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Delete → gone in ≤30d</text>
  <text x="530" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Improve on → up to 5y*</text>
  <text x="530" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">*de-identified training</text>

  <rect x="650" y="140" width="290" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="795" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Up to 2 years</text>
  <text x="795" y="192" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">Classifier scores up to 7y</text>
  <text x="795" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Flag ≠ proven violation</text>

  <!-- Row 2: Teams / Enterprise UI -->
  <rect x="40" y="220" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="140" y="248" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Teams / Enterprise UI</text>
  <text x="140" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">claude.ai product surfaces</text>
  <text x="140" y="284" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">not ZDR-eligible</text>

  <rect x="250" y="220" width="160" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="330" y="252" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e40af">Yes</text>
  <text x="330" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1e40af">where traffic is</text>
  <text x="330" y="286" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1e40af">retainable</text>

  <rect x="420" y="220" width="220" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="530" y="252" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Org retention setting</text>
  <text x="530" y="270" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Admin-controlled</text>
  <text x="530" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Check Data &amp; privacy</text>

  <rect x="650" y="220" width="290" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="795" y="252" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Up to 2 years</text>
  <text x="795" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">if automated systems flag</text>
  <text x="795" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">+ legal holds</text>

  <!-- Row 3: Commercial ZDR -->
  <rect x="40" y="300" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="140" y="328" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Commercial + ZDR</text>
  <text x="140" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">Eligible API / CC via key</text>
  <text x="140" y="364" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">or CC Enterprise ZDR</text>

  <rect x="250" y="300" width="160" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="330" y="332" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">No</text>
  <text x="330" y="352" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">does not run on</text>
  <text x="330" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">ZDR traffic today</text>

  <rect x="420" y="300" width="220" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="530" y="332" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#166534">No prompt/output at rest</text>
  <text x="530" y="350" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#166534">after response*</text>
  <text x="530" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">*eligible features only</text>

  <rect x="650" y="300" width="290" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="795" y="328" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#9a3412">Still possible if flagged</text>
  <text x="795" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#c2410c">Other classifiers may retain</text>
  <text x="795" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Safety scores; up to 2y I/O</text>

  <!-- Row 4: Cyber Verification note strip -->
  <rect x="40" y="384" width="900" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="490" y="408" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Cyber Verification (security teams): reduces blocking classifiers for authorized work</text>
  <text x="490" y="428" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#1e40af">Does not by itself mean “no monitoring.” Pair with ZDR + session allowlists when research looks like misuse.</text>
</svg>
