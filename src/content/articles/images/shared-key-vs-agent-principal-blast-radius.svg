<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Shared key vs agent principal blast radius</title>
  <desc id="desc">Left panel: one shared API key or env var feeds many agents so revoke or rotate hits all. Right panel: each agent is its own principal with a short-lived token so revoke stops one agent only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="460" fill="#f8fafc"/>

  <text x="40" y="34" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Blast radius: shared employee key vs agent-as-principal</text>
  <text x="40" y="56" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Revoke design decides whether one bad agent takes down the fleet—or only itself.</text>

  <!-- LEFT PANEL -->
  <rect x="28" y="76" width="450" height="320" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="48" y="104" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Shared key / borrowed session</text>

  <rect x="56" y="124" width="200" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="156" y="150" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">One env API key</text>
  <text x="156" y="170" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">or admin OAuth session</text>

  <!-- fan-out lines -->
  <line x1="256" y1="156" x2="300" y2="156" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-bad)"/>
  <path d="M 300 156 L 320 120 L 340 120" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M 300 156 L 340 156" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M 300 156 L 320 192 L 340 192" fill="none" stroke="#b91c1c" stroke-width="1.8"/>

  <rect x="340" y="98" width="110" height="44" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="395" y="125" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9a3412">Agent A</text>

  <rect x="340" y="154" width="110" height="44" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="395" y="181" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9a3412">Agent B</text>

  <rect x="340" y="210" width="110" height="44" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="395" y="237" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9a3412">Agent C</text>

  <rect x="56" y="278" width="394" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="253" y="308" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Revoke / rotate → all agents break</text>
  <text x="253" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">Audit lines collapse to the shared identity</text>
  <text x="253" y="350" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">Admins leave the key live rather than take the fleet down</text>

  <!-- RIGHT PANEL -->
  <rect x="502" y="76" width="450" height="320" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="522" y="104" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">Agent as its own principal</text>

  <!-- three principals -->
  <rect x="526" y="124" width="118" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="585" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Agent A ID</text>
  <text x="585" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">own short token</text>

  <rect x="668" y="124" width="118" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="727" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Agent B ID</text>
  <text x="727" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">own short token</text>

  <rect x="810" y="124" width="118" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="869" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Agent C ID</text>
  <text x="869" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">own short token</text>

  <!-- revoke only B -->
  <line x1="727" y1="194" x2="727" y2="230" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-good)"/>
  <rect x="618" y="232" width="218" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="727" y="259" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Revoke Agent B only</text>

  <rect x="526" y="298" width="402" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="727" y="328" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">A and C keep running</text>
  <text x="727" y="350" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#15803d">Logs name the agent (actor) + human authority when delegated</text>

  <text x="490" y="430" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#334155">Design for one-agent revoke before you scale agent count.</text>
  <text x="490" y="450" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Shared secrets make containment a fleet outage; principals make it a single toggle.</text>
</svg>
