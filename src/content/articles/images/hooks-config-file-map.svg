<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Hook config file map across Claude, Codex, Cursor, and Copilot</title>
  <desc id="desc">File map of Claude settings.json, Codex hooks.json and config.toml, Cursor hooks.json, and Copilot hook paths, marking which files orchestrators write and which managed or policy files a user uninstall does not edit.</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="700" fill="#f8fafc"/>

  <text x="28" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Which file owns the hook entry</text>
  <text x="28" y="52" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Open the file the host menu names. Shaded rows are managed or policy: a user uninstall does not edit them.</text>

  <!-- Claude -->
  <rect x="28" y="72" width="256" height="448" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="28" y="72" width="256" height="36" rx="10" fill="#dbeafe"/>
  <rect x="28" y="96" width="256" height="12" fill="#dbeafe"/>
  <text x="42" y="95" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Claude Code</text>

  <text x="42" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.claude/settings.json</text>
  <text x="42" y="144" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">User-wide. Orca, Herdr, cmux.</text>

  <text x="42" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">.claude/settings.json</text>
  <text x="42" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Project scope. Can be committed.</text>

  <text x="42" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">.claude/settings.local.json</text>
  <text x="42" y="228" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Project-local. Not the user inject path.</text>

  <text x="42" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">plugin hooks/hooks.json</text>
  <text x="42" y="270" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Loads while that plugin is enabled.</text>

  <rect x="40" y="286" width="232" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="50" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#7f1d1d">managed policy settings</text>
  <text x="50" y="322" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#991b1b">User disableAllHooks cannot stop these.</text>

  <text x="42" y="364" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">/hooks</text>
  <text x="42" y="380" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Read-only. Labels user, project,</text>
  <text x="42" y="394" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">local, plugin, or session.</text>
  <text x="42" y="420" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Cloud sessions skip your local</text>
  <text x="42" y="434" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">~/.claude/settings.json.</text>
  <text x="42" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">No per-hook enabled:false yet.</text>

  <!-- Codex -->
  <rect x="300" y="72" width="256" height="448" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="300" y="72" width="256" height="36" rx="10" fill="#ede9fe"/>
  <rect x="300" y="96" width="256" height="12" fill="#ede9fe"/>
  <text x="314" y="95" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#4c1d95">Codex</text>

  <text x="314" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.codex/hooks.json</text>
  <text x="314" y="144" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Herdr and cmux edit this file.</text>

  <text x="314" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.codex/config.toml</text>
  <text x="314" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">[features] hooks and inline [hooks].</text>

  <text x="314" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">project .codex/</text>
  <text x="314" y="228" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Both files, only if the project is trusted.</text>

  <text x="314" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">plugin hooks/hooks.json</text>
  <text x="314" y="270" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Same trust review as other hooks.</text>

  <rect x="312" y="286" width="232" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="322" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#7f1d1d">requirements.toml</text>
  <text x="322" y="322" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#991b1b">Managed. User /hooks cannot disable.</text>

  <text x="314" y="364" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">/hooks</text>
  <text x="314" y="380" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Trust or disable non-managed hooks.</text>
  <text x="314" y="396" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Trust is stored against the hash.</text>
  <text x="314" y="420" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Postman SessionStart + trust record</text>
  <text x="314" y="434" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">land in this home, not the app bundle.</text>
  <text x="314" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Layers merge. They do not replace.</text>

  <!-- Cursor -->
  <rect x="572" y="72" width="256" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="572" y="72" width="256" height="36" rx="10" fill="#e2e8f0"/>
  <rect x="572" y="96" width="256" height="12" fill="#e2e8f0"/>
  <text x="586" y="95" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Cursor</text>

  <text x="586" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.cursor/hooks.json</text>
  <text x="586" y="144" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">User hooks. Herdr sessionStart.</text>

  <text x="586" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">project .cursor/hooks.json</text>
  <text x="586" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Trusted workspace. Cloud agents load it.</text>

  <rect x="584" y="200" width="232" height="68" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="594" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#7f1d1d">MDM hooks.json</text>
  <text x="594" y="236" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#991b1b">Library, /etc/cursor, or ProgramData.</text>
  <text x="594" y="252" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#991b1b">Team cloud hooks: admin dashboard.</text>

  <text x="586" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">Third-party hooks</text>
  <text x="586" y="308" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Also loads Claude-style hook files.</text>

  <text x="586" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">Cloud home gap</text>
  <text x="586" y="350" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">~/.cursor/hooks.json is not on the</text>
  <text x="586" y="366" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">cloud agent VM. Project hooks are.</text>
  <text x="586" y="400" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Any deny wins over ask, then allow.</text>
  <text x="586" y="424" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Deleting the home file leaves MDM</text>
  <text x="586" y="438" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">and team hooks in place.</text>
  <text x="586" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Enterprise still needs an admin.</text>

  <!-- Copilot -->
  <rect x="844" y="72" width="248" height="448" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="844" y="72" width="248" height="36" rx="10" fill="#ccfbf1"/>
  <rect x="844" y="96" width="248" height="12" fill="#ccfbf1"/>
  <text x="858" y="95" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#115e59">Copilot CLI</text>

  <text x="858" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.copilot/settings.json</text>
  <text x="858" y="144" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Inline hooks. Herdr SessionStart.</text>

  <text x="858" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">~/.copilot/hooks/*.json</text>
  <text x="858" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Or $COPILOT_HOME/hooks.</text>

  <text x="858" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">.github/hooks/*.json</text>
  <text x="858" y="228" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Repo files. Cloud jobs load these.</text>

  <text x="858" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">.github/copilot/settings.json</text>
  <text x="858" y="270" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Plus settings.local.json.</text>

  <text x="858" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#0f172a">repo .claude/settings.json</text>
  <text x="858" y="312" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">CLI also reads this cross-tool file.</text>

  <rect x="856" y="326" width="224" height="52" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="866" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#7f1d1d">policy.d/*.json</text>
  <text x="866" y="362" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#991b1b">Ignores disableAllHooks. Always on.</text>

  <text x="858" y="404" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Same event in many files: every</text>
  <text x="858" y="418" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">entry runs. config.json is no longer</text>
  <text x="858" y="432" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">a hooks source.</text>
  <text x="858" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Policy needs an administrator.</text>

  <!-- Footer writers -->
  <rect x="28" y="536" width="1064" height="144" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="44" y="560" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Where the writers in this audit land</text>
  <text x="44" y="582" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Orca  -  Claude user settings.json, and ~/.codex only when the hook changed.</text>
  <text x="44" y="602" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Herdr  -  Claude settings.json + script; Codex hooks.json and a config.toml feature flag; Copilot settings.json; Cursor hooks.json.</text>
  <text x="44" y="622" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Postman  -  Codex plugin SessionStart (detected-agents installer can trust it); Claude plugin on the Desktop upgrade path in #14370.</text>
  <text x="44" y="642" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">cmux and Paradev  -  same user-config class, corroboration only. Each unload removes its own entries.</text>
  <text x="44" y="662" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Sources: Claude Code, Codex, Cursor, and Copilot hooks docs; Orca, Herdr, Postman, cmux, and Paradev primary docs.</text>
</svg>
