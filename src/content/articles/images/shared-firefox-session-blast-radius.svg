<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Shared Firefox session blast radius</title>
  <desc id="desc">Left: coding agent attached to a daily Firefox profile inherits cookies, SSO, bank and admin tabs. Right: dedicated agent profile limits cookies and accounts the agent can reach.</desc>
  <defs>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="520" fill="#f8fafc"/>

  <text x="40" y="34" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Shared-session blast radius: daily profile vs dedicated agent profile</text>
  <text x="40" y="56" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">The MCP bridge does not invent new accounts—it inherits whatever cookies and tabs that Firefox profile already holds.</text>

  <!-- LEFT: daily profile -->
  <rect x="28" y="76" width="450" height="400" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="48" y="104" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Daily / personal Firefox profile</text>

  <rect x="56" y="122" width="200" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="156" y="145" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Coding agent</text>
  <text x="156" y="163" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">via shared-browser MCP</text>

  <line x1="256" y1="150" x2="300" y2="150" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-bad)"/>
  <path d="M 300 150 L 320 120 L 340 120" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M 300 150 L 340 150" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M 300 150 L 320 180 L 340 180" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M 300 150 L 320 210 L 340 210" fill="none" stroke="#b91c1c" stroke-width="1.8"/>

  <rect x="340" y="100" width="118" height="40" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="399" y="125" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#9a3412">Bank / finance</text>

  <rect x="340" y="148" width="118" height="40" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="399" y="173" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#9a3412">Work SSO / admin</text>

  <rect x="340" y="196" width="118" height="40" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="399" y="221" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#9a3412">Mail / identity</text>

  <rect x="56" y="250" width="394" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="253" y="278" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">What the agent inherits</text>
  <text x="253" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">Live cookies · SSO tokens · open admin tabs</text>
  <text x="253" y="320" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">Page reads → model context → tool surface</text>

  <rect x="56" y="368" width="394" height="86" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="253" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9f1239">Blast radius = every account in that profile</text>
  <text x="253" y="420" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#be123c">Prompt injection or a bad tool call acts as you</text>
  <text x="253" y="438" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#be123c">Revoke means rotating human sessions, not one agent</text>

  <!-- RIGHT: dedicated profile -->
  <rect x="502" y="76" width="450" height="400" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="522" y="104" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">Dedicated agent Firefox profile</text>

  <rect x="530" y="122" width="200" height="56" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="145" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Coding agent</text>
  <text x="630" y="163" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#15803d">same MCP class, tighter cookies</text>

  <line x1="730" y1="150" x2="774" y2="150" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-good)"/>
  <path d="M 774 150 L 794 130 L 814 130" fill="none" stroke="#15803d" stroke-width="1.8"/>
  <path d="M 774 150 L 814 170" fill="none" stroke="#15803d" stroke-width="1.8"/>

  <rect x="814" y="110" width="118" height="40" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="873" y="135" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#065f46">Task-only logins</text>

  <rect x="814" y="162" width="118" height="40" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="873" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#065f46">Disposable tabs</text>

  <rect x="530" y="250" width="394" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="727" y="278" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#166534">What stays out</text>
  <text x="727" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#15803d">Banking · primary mail · prod admin SSO</text>
  <text x="727" y="320" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#15803d">Personal password vault autofill targets</text>

  <rect x="530" y="368" width="394" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="727" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#065f46">Blast radius = only accounts you signed in</text>
  <text x="727" y="420" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#047857">Still not prompt-injection-proof—just smaller</text>
  <text x="727" y="438" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#047857">Pair with read → draft → act + human approval</text>
</svg>
