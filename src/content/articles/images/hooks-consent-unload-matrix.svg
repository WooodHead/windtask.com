<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Consent and unload matrix for coding-agent hooks</title>
  <desc id="desc">Matrix comparing orchestrator inject plus toggle or CLI uninstall, a desktop auto-upgrade installer, and the host /hooks trust review. Rows cover who writes, consent, official unload, leftovers, and user disable flags.</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="760" fill="#f8fafc"/>

  <text x="28" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Consent and unload: who wrote the hook, and what actually removes it</text>
  <text x="28" y="52" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Same hygiene class. Name the writer before you edit a file. A user-level off switch does not clear managed or policy hooks.</text>

  <!-- Column headers -->
  <rect x="176" y="68" width="300" height="62" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="326" y="90" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Orchestrator inject</text>
  <text x="326" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#1d4ed8">Orca + Herdr - toggle or CLI uninstall</text>

  <rect x="484" y="68" width="300" height="62" rx="6" fill="#ffedd5" stroke="#fb923c" stroke-width="1.2"/>
  <text x="634" y="90" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9a3412">Desktop auto-upgrade</text>
  <text x="634" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#c2410c">Postman installer - self-approves SessionStart</text>

  <rect x="792" y="68" width="300" height="62" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="942" y="90" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#14532d">Host /hooks trust</text>
  <text x="942" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#166534">Codex + Claude - you review the definition</text>

  <!-- Row: Who writes -->
  <rect x="28" y="138" width="140" height="96" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="184" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Who writes</text>
  <text x="98" y="202" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">owning file</text>

  <rect x="176" y="138" width="300" height="96" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="190" y="162" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Claude user settings.json and ~/.codex.</text>
  <text x="190" y="180" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Herdr also edits hooks.json and sets</text>
  <text x="190" y="198" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">[features] hooks = true in config.toml.</text>

  <rect x="484" y="138" width="300" height="96" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="498" y="162" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Detected-agents installer, every host</text>
  <text x="498" y="180" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">it finds. Desktop 12.33.4 log: upgrade</text>
  <text x="498" y="198" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">installed Claude and Codex plugins.</text>

  <rect x="792" y="138" width="300" height="96" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="806" y="162" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">You, a plugin, or admin policy.</text>
  <text x="806" y="180" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">User, project, plugin, and managed</text>
  <text x="806" y="198" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">files load together. See the file map.</text>

  <!-- Row: Consent -->
  <rect x="28" y="242" width="140" height="96" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="286" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Consent</text>
  <text x="98" y="304" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">before it runs</text>

  <rect x="176" y="242" width="300" height="96" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="190" y="266" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Settings toggle or install command.</text>
  <text x="190" y="284" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Orca writes the Codex hook only when</text>
  <text x="190" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">it changes, so the re-prompt stops.</text>

  <rect x="484" y="242" width="300" height="96" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
  <text x="498" y="266" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#9a3412">Installer approves the hook.</text>
  <text x="498" y="284" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7c2d12">Per-agent Codex app or CLI install</text>
  <text x="498" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7c2d12">stays untrusted until you review it.</text>

  <rect x="792" y="242" width="300" height="96" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="806" y="266" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Codex /hooks trusts the exact hash.</text>
  <text x="806" y="284" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">A changed hook needs review again.</text>
  <text x="806" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Claude /hooks shows source only.</text>

  <!-- Row: Official unload -->
  <rect x="28" y="346" width="140" height="96" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Official</text>
  <text x="98" y="404" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">unload</text>

  <rect x="176" y="346" width="300" height="96" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="190" y="370" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Orca: Agent status hooks OFF,</text>
  <text x="190" y="388" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#1e3a8a">or orca agent hooks off.</text>
  <text x="190" y="406" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#1e3a8a">Herdr: integration uninstall per agent.</text>

  <rect x="484" y="346" width="300" height="96" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
  <text x="498" y="370" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">npx @postman/postman-plugin remove</text>
  <text x="498" y="388" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7c2d12">Desktop app uninstall is not that</text>
  <text x="498" y="406" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7c2d12">command. It leaves agent config in place.</text>

  <rect x="792" y="346" width="300" height="96" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/>
  <text x="806" y="370" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Codex: disable non-managed in /hooks,</text>
  <text x="806" y="388" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#14532d">or [features] hooks = false.</text>
  <text x="806" y="406" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#14532d">Claude: delete the entry /hooks names.</text>

  <!-- Row: What remains -->
  <rect x="28" y="450" width="140" height="96" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="98" y="490" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">What</text>
  <text x="98" y="508" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">remains</text>

  <rect x="176" y="450" width="300" height="96" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="190" y="474" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">#13783: reported Orca entries after</text>
  <text x="190" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">app uninstall. Herdr leaves Codex</text>
  <text x="190" y="510" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">config.toml, including hooks = true.</text>

  <rect x="484" y="450" width="300" height="96" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="498" y="474" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">Plugin and trust record sit in the</text>
  <text x="498" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">agent home (~/.codex, ~/.claude),</text>
  <text x="498" y="510" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">outside the desktop application tree.</text>

  <rect x="792" y="450" width="300" height="96" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="806" y="474" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#0f172a">#37362: Desktop can skip a changed</text>
  <text x="806" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">project hook with no review UI.</text>
  <text x="806" y="510" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#92400e">Project trust is not hook-definition trust.</text>

  <!-- Row: User disable -->
  <rect x="28" y="554" width="140" height="96" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="98" y="594" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">User</text>
  <text x="98" y="612" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">disable</text>

  <rect x="176" y="554" width="300" height="96" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="190" y="578" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7f1d1d">Product OFF stops that product</text>
  <text x="190" y="596" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">reinstalling. Admin-managed hooks</text>
  <text x="190" y="614" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">still ignore the user disable flag.</text>

  <rect x="484" y="554" width="300" height="96" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="498" y="578" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7f1d1d">Installer trusted_hash is not a</text>
  <text x="498" y="596" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">review you did in /hooks. Policy</text>
  <text x="498" y="614" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">hooks still cannot be user-disabled.</text>

  <rect x="792" y="554" width="300" height="96" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="806" y="578" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#7f1d1d">Managed, MDM, team, and Copilot</text>
  <text x="806" y="596" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">policy hooks ignore user</text>
  <text x="806" y="614" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#991b1b">disableAllHooks and user /hooks.</text>

  <rect x="28" y="664" width="1064" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="44" y="688" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Reading the matrix</text>
  <text x="44" y="708" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Pick the column for the writer you installed. Run that column's official unload, then check the "what remains" cell before the next session.</text>
  <text x="44" y="726" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Sources: Orca hooks docs; Herdr integrations; Postman detected-agents + #14370; Codex hooks docs + #37362; Claude Code hooks docs.</text>
</svg>
