<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Migration decision tree for pull_request_target</title>
  <desc id="desc">If the workflow does not need secrets or a write token, switch to pull_request. If it executes fork code, split untrusted CI from a privileged job. If it only labels or comments on trusted workflow code, allow that file in an event policy with least privilege.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .ink { fill: #0f172a; }
    .muted { fill: #475569; }
    .q { fill: #e2e8f0; stroke: #64748b; }
    .a { fill: #ecfdf5; stroke: #34d399; }
    .b { fill: #eff6ff; stroke: #60a5fa; }
    .c { fill: #fff7ed; stroke: #fb923c; }
    .inkA { fill: #065f46; }
    .inkB { fill: #1e3a8a; }
    .inkC { fill: #9a3412; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .ink { fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .q { fill: #334155; stroke: #94a3b8; }
      .a { fill: #064e3b; stroke: #34d399; }
      .b { fill: #1e3a8a; stroke: #93c5fd; }
      .c { fill: #431407; stroke: #fdba74; }
      .inkA { fill: #a7f3d0; }
      .inkB { fill: #dbeafe; }
      .inkC { fill: #ffedd5; }
    }
  </style>
  <rect class="bg" width="980" height="520"/>
  <text class="ink" x="28" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Per workflow file: keep, split, or leave the default block</text>
  <text class="muted" x="28" y="54" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Public repos. Private and internal repos are outside this default. An existing event policy is not replaced.</text>

  <rect class="q" x="300" y="74" width="380" height="52" rx="8"/>
  <text class="ink" x="490" y="106" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Needs secrets or a write token on fork PRs?</text>

  <rect class="a" x="28" y="168" width="290" height="130" rx="8"/>
  <text class="inkA" x="44" y="196" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">No ’ pull_request</text>
  <text class="ink" x="44" y="222" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Same PR activity, untrusted workflow</text>
  <text class="ink" x="44" y="242" font-family="system-ui,Segoe UI,sans-serif" font-size="12">file, read-only token, no secrets.</text>
  <text class="ink" x="44" y="268" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Leave the default block in place.</text>

  <rect class="q" x="360" y="168" width="300" height="52" rx="8"/>
  <text class="ink" x="510" y="200" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Yes. Does it run fork code?</text>

  <rect class="b" x="340" y="260" width="320" height="150" rx="8"/>
  <text class="inkB" x="356" y="288" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Runs code ’ split the job</text>
  <text class="ink" x="356" y="314" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Untrusted build on pull_request.</text>
  <text class="ink" x="356" y="334" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Privileged step only on trusted code,</text>
  <text class="ink" x="356" y="354" font-family="system-ui,Segoe UI,sans-serif" font-size="12">or after label + environment review.</text>
  <text class="ink" x="356" y="380" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Treat artifacts as data, not scripts.</text>

  <rect class="c" x="690" y="260" width="262" height="150" rx="8"/>
  <text class="inkC" x="706" y="288" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">No execution ’ allow file</text>
  <text class="ink" x="706" y="314" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Event policy, this path only.</text>
  <text class="ink" x="706" y="334" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Least-privilege GITHUB_TOKEN.</text>
  <text class="ink" x="706" y="354" font-family="system-ui,Segoe UI,sans-serif" font-size="12">No head checkout. No cache write.</text>
  <text class="ink" x="706" y="380" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Reviewers if a secret is touched.</text>

  <text class="muted" x="28" y="470" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Brownouts (Nov 9 and Nov 16, 16:0018:00 UTC) fail blocked attempts. Dec 2, 2026 makes the default block permanent on GitHub.com public repos.</text>
  <text class="muted" x="28" y="492" font-family="system-ui,Segoe UI,sans-serif" font-size="12">GitHub Enterprise Server is out of scope for this changelog. OIDC does not make executing a fork Makefile safe.</text>
</svg>
