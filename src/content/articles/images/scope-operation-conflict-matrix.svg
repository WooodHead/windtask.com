<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Scope × operation conflict matrix</title>
  <desc id="desc">Matrix of additive versus destructive operations on the same semantic scope. HIGH asserted findings fire when both sides declare exact scope with opposing operation classes.</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="560" fill="#f8fafc"/>

  <text x="36" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Scope × operation: when intent conflicts assert HIGH</text>
  <text x="36" y="54" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Same full semantic scope + declared operations. Asserted HIGH only for exact matches; loose/prose matches stay below HIGH.</text>

  <!-- Column headers: Agent B ops -->
  <text x="490" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#334155">Agent B declared operation →</text>

  <!-- Row label -->
  <text x="28" y="300" transform="rotate(-90 28 300)" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#334155">Agent A declared operation →</text>

  <!-- Corner cell -->
  <rect x="100" y="100" width="160" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#0f172a">Same scope</text>
  <text x="180" y="142" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">e.g. symbol:PaymentService</text>

  <!-- B headers -->
  <rect x="268" y="100" width="220" height="56" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="378" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Additive</text>
  <text x="378" y="142" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1d4ed8">add · extend · modify</text>

  <rect x="496" y="100" width="220" height="56" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="606" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">Destructive</text>
  <text x="606" y="142" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">replace · remove · rename · migrate</text>

  <rect x="724" y="100" width="220" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="834" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#334155">Not exact / inferred</text>
  <text x="834" y="142" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">alias · loose · prose guess</text>

  <!-- A Additive row -->
  <rect x="100" y="164" width="160" height="120" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="180" y="218" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Additive</text>
  <text x="180" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#1d4ed8">add · extend · modify</text>

  <rect x="268" y="164" width="220" height="120" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="378" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#92400e">MEDIUM</text>
  <text x="378" y="230" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#a16207">shared_contract</text>
  <text x="378" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#78716c">FM-C003 · coordinate order</text>

  <rect x="496" y="164" width="220" height="120" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="606" y="206" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#991b1b">HIGH asserted</text>
  <text x="606" y="228" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">destructive_vs_additive</text>
  <text x="606" y="248" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#7f1d1d">FM-C001 · extension point gone</text>
  <text x="606" y="266" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#7f1d1d">← classic PaymentService case</text>

  <rect x="724" y="164" width="220" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="834" y="214" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#475569">Surfaced ≤ MEDIUM</text>
  <text x="834" y="236" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Cannot assert HIGH</text>
  <text x="834" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Ambiguity stays advisory</text>

  <!-- A Destructive row -->
  <rect x="100" y="292" width="160" height="120" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="180" y="346" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">Destructive</text>
  <text x="180" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">replace · remove · rename · migrate</text>

  <rect x="268" y="292" width="220" height="120" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="378" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#991b1b">HIGH asserted</text>
  <text x="378" y="356" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">destructive_vs_additive</text>
  <text x="378" y="376" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#7f1d1d">FM-C001 · same clash flipped</text>

  <rect x="496" y="292" width="220" height="120" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="606" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#991b1b">HIGH asserted</text>
  <text x="606" y="356" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">divergent_rewrite</text>
  <text x="606" y="376" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#7f1d1d">FM-C002 · pick one design</text>

  <rect x="724" y="292" width="220" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="834" y="342" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#475569">Surfaced ≤ MEDIUM</text>
  <text x="834" y="364" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Declare FQ names to assert</text>
  <text x="834" y="382" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Synonyms stay agent judgement</text>

  <!-- Footer legend -->
  <rect x="100" y="432" width="844" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="120" y="460" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Reading the matrix</text>
  <text x="120" y="482" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">HIGH asserted = both sides declared operations on the exact same full scope. That fact can stop acceptance until resolved or overridden with a logged reason.</text>
  <text x="120" y="504" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Claims remain advisory leases—agents may continue writing. The hard gate is acceptance of a ChangeSet, not start-time file locks.</text>
  <text x="120" y="526" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Sources: Foremerge conflict-detection.md (FM-C001–C003); operations table (additive vs destructive).</text>
</svg>
