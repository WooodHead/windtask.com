<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Coding-agent resource lifecycle</title>
  <desc id="desc">Flow from agent create through session end to orphan cloud bill</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="320" fill="#f8fafc"/>
  <!-- Step 1 -->
  <rect x="28" y="88" width="180" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="118" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">1. Agent creates</text>
  <text x="118" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#475569">VM / DB / deploy / EIP</text>
  <text x="118" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">via shell or MCP</text>
  <!-- Arrow 1 -->
  <line x1="218" y1="138" x2="268" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="278" y="88" width="180" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="368" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">2. Task finishes</text>
  <text x="368" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#475569">Agent says “done”</text>
  <text x="368" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Focus moves on</text>
  <!-- Arrow 2 -->
  <line x1="468" y1="138" x2="518" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="528" y="88" width="180" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="618" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">3. Session ends</text>
  <text x="618" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#475569">Chat / CLI exits</text>
  <text x="618" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">≠ resource deleted</text>
  <!-- Arrow 3 -->
  <line x1="718" y1="138" x2="768" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="778" y="88" width="120" height="100" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="838" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#991b1b">4. Orphan</text>
  <text x="838" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#b91c1c">still billing</text>
  <text x="838" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#dc2626">cloud bill</text>
  <!-- Caption -->
  <text x="460" y="260" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#334155">Ending a coding-agent session does not tear down what it created.</text>
  <text x="460" y="284" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Without an explicit delete (logged or verified), the meter keeps running.</text>
</svg>
