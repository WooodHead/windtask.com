<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Multi-worktree declared-intent topology</title>
  <desc id="desc">Two isolated worktrees publish intents into one SQLite store under the Git common directory. Conflict detection compares declared scopes before either tree changes files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="520" fill="#f8fafc"/>

  <text x="36" y="32" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Multi-worktree + declared-intent topology</text>
  <text x="36" y="54" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Isolated checkouts; one shared coordination store. Plans collide in a queryable DB before Git has a textual conflict.</text>

  <!-- Worktree A -->
  <rect x="28" y="78" width="280" height="280" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="48" y="106" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Worktree A</text>
  <text x="48" y="126" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">../payments-stripe</text>

  <rect x="48" y="142" width="240" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="168" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1e40af">Claude Code</text>
  <text x="168" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#3b82f6">agent session</text>

  <rect x="48" y="210" width="240" height="64" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="168" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#0c4a6e">Intent: replace PaymentService</text>
  <text x="168" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0369a1">scope: symbol:PaymentService=replace</text>

  <rect x="48" y="290" width="240" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="168" y="317" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#475569">Working tree still clean</text>

  <!-- Worktree B -->
  <rect x="672" y="78" width="280" height="280" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="692" y="106" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#9a3412">Worktree B</text>
  <text x="692" y="126" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">../payments-paypal</text>

  <rect x="692" y="142" width="240" height="52" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="812" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9a3412">Codex / Cursor</text>
  <text x="812" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">agent session</text>

  <rect x="692" y="210" width="240" height="64" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="812" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#92400e">Intent: extend PaymentService</text>
  <text x="812" y="254" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#a16207">scope: symbol:PaymentService=extend</text>

  <rect x="692" y="290" width="240" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="812" y="317" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#475569">Working tree still clean</text>

  <!-- Center store -->
  <rect x="340" y="100" width="300" height="240" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="490" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">Shared coordination store</text>
  <text x="490" y="148" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">.git common dir · SQLite</text>

  <rect x="360" y="164" width="260" height="48" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
  <text x="490" y="184" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#14532d">CLI / MCP / JSON API</text>
  <text x="490" y="202" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">publish_intent · claim_work · check_conflicts</text>

  <rect x="360" y="226" width="260" height="88" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="490" y="252" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">HIGH · FM-C001</text>
  <text x="490" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">destructive_vs_additive</text>
  <text x="490" y="292" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#7f1d1d">Advisory finding · no file lock</text>

  <!-- Arrows A -> store -->
  <path d="M 308 220 L 332 220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#475569">publish</text>

  <!-- Arrows B -> store -->
  <path d="M 672 220 L 648 220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#475569">publish</text>

  <!-- Conflict back to B -->
  <path d="M 490 330 L 490 360 L 812 360 L 812 334" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-warn)"/>
  <text x="650" y="352" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">finding on 2nd publish</text>

  <!-- Bottom Git bar -->
  <rect x="28" y="390" width="924" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="48" y="420" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Git stays the repository</text>
  <text x="48" y="442" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Worktrees share one object store and refs. Coordination state is not in clone/push—back it up separately if the ledger matters.</text>
  <text x="48" y="464" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Acceptance later runs a human-registered check against the candidate fingerprint. Agent-reported “tests passed” is provenance, not proof.</text>
  <text x="48" y="486" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Heterogeneous fleets are the design center: Claude Code + Codex + Cursor talk to the same store via MCP/CLI.</text>
</svg>
