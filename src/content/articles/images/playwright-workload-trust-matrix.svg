<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Three Playwright workloads trust matrix</title>
  <desc id="desc">Decision matrix comparing own-app E2E tests, agent untrusted browsing, and Playwright MCP across engine freshness, chromiumSandbox, network egress, and isolation defaults</desc>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc"/>

  <text x="32" y="34" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Trust matrix: choose controls by workload, not by the latest CVE headline</text>
  <text x="32" y="54" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#64748b">Defaults assume Playwright launch API (chromiumSandbox defaults to false). Confirm MCP flags and host OS constraints.</text>

  <!-- Headers -->
  <rect x="32" y="74" width="200" height="56" rx="8" fill="#0f172a"/>
  <text x="132" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Workload</text>

  <rect x="242" y="74" width="170" height="56" rx="8" fill="#0f172a"/>
  <text x="327" y="98" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Page trust</text>
  <text x="327" y="116" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">what it loads</text>

  <rect x="422" y="74" width="170" height="56" rx="8" fill="#0f172a"/>
  <text x="507" y="98" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Engine freshness</text>
  <text x="507" y="116" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">bundled lag risk</text>

  <rect x="602" y="74" width="170" height="56" rx="8" fill="#0f172a"/>
  <text x="687" y="98" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Sandbox default</text>
  <text x="687" y="116" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">chromiumSandbox</text>

  <rect x="782" y="74" width="186" height="56" rx="8" fill="#0f172a"/>
  <text x="875" y="98" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Minimum controls</text>
  <text x="875" y="116" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#cbd5e1">if you keep browsing</text>

  <!-- Row 1: Own-app E2E -->
  <rect x="32" y="144" width="200" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="132" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Own-app E2E</text>
  <text x="132" y="198" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">CI / local test suite</text>
  <text x="132" y="216" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">only your URLs</text>

  <rect x="242" y="144" width="170" height="96" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="327" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#166534">High</text>
  <text x="327" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">first-party app</text>
  <text x="327" y="224" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#15803d">fixtures you own</text>

  <rect x="422" y="144" width="170" height="96" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="507" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9a3412">Medium</text>
  <text x="507" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">lag matters less</text>
  <text x="507" y="224" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">still update PW</text>

  <rect x="602" y="144" width="170" height="96" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="687" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9a3412">Off by default</text>
  <text x="687" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">OK for trusted</text>
  <text x="687" y="224" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">pages in CI</text>

  <rect x="782" y="144" width="186" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="875" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Pin known URLs</text>
  <text x="875" y="196" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">non-root runners</text>
  <text x="875" y="214" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">upgrade on schedule</text>
  <text x="875" y="232" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">sandbox optional</text>

  <!-- Row 2: Agent untrusted browsing -->
  <rect x="32" y="254" width="200" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="132" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Agent untrusted</text>
  <text x="132" y="308" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">Claude Code / Cursor</text>
  <text x="132" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">open-web research</text>

  <rect x="242" y="254" width="170" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="327" y="296" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Low</text>
  <text x="327" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">arbitrary sites</text>
  <text x="327" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">unreviewed HTML</text>

  <rect x="422" y="254" width="170" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="507" y="296" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">High risk</text>
  <text x="507" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">bundle lag hurts</text>
  <text x="507" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">prefer channel chrome</text>

  <rect x="602" y="254" width="170" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="687" y="296" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Must turn on</text>
  <text x="687" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">chromiumSandbox</text>
  <text x="687" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">true (or MCP --sandbox)</text>

  <rect x="782" y="254" width="186" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="875" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#991b1b">Fresh Chrome</text>
  <text x="875" y="306" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">sandbox on</text>
  <text x="875" y="324" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">egress allowlist</text>
  <text x="875" y="342" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">disposable VM</text>

  <!-- Row 3: Playwright MCP -->
  <rect x="32" y="364" width="200" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="132" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Playwright MCP</text>
  <text x="132" y="418" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#475569">Cursor / Claude Code</text>
  <text x="132" y="436" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">tool-driven browsing</text>

  <rect x="242" y="364" width="170" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="327" y="406" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Mixed → Low</text>
  <text x="327" y="428" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">agent chooses URL</text>
  <text x="327" y="444" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">treat as untrusted</text>

  <rect x="422" y="364" width="170" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="507" y="406" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#991b1b">High risk</text>
  <text x="507" y="428" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">same PW pin</text>
  <text x="507" y="444" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#b91c1c">--browser=chrome</text>

  <rect x="602" y="364" width="170" height="96" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="687" y="406" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#9a3412">Check flags</text>
  <text x="687" y="428" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">prefer --sandbox</text>
  <text x="687" y="444" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#c2410c">avoid --no-sandbox</text>

  <rect x="782" y="364" width="186" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="875" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#991b1b">Origin allowlist</text>
  <text x="875" y="416" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">isolated profile</text>
  <text x="875" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">no daily cookies</text>
  <text x="875" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#b91c1c">no host secrets</text>

  <text x="500" y="492" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#475569">Axis note: this is browser-engine freshness + containment—not a “sandbox escape checklist” for agent privileges.</text>
</svg>
